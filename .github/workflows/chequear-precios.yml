name: Chequear precios

on:
  schedule:
    # Todos los días a las 12:00 UTC (9:00 en Argentina).
    - cron: '0 12 * * *'
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña "Actions" de GitHub, para probar.

jobs:
  chequear-precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: node scripts/chequear-precios.js
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
